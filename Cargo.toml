[package]
name = "pytte"
version = "0.3.0"
edition = "2024"
description = "A crash-proof multi-tab plaintext editor for Windows, built for raw speed"
license = "MIT"
repository = "https://github.com/SGJohansson/Pytte"
authors = ["S.G. Johansson"]

[dependencies]
memchr = "2"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.62"
default-features = false
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
